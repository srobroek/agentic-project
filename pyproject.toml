[project]
name = "project-setup"
version = "0.1.0"
description = "Deterministic, layered project scaffolding over Copier templates"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["copier>=9.18", "pyyaml>=6"]

[project.scripts]
project-setup = "project_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_setup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# So `pytest` works in a fresh clone, before `uv pip install -e .`. Without it every
# test file failed to collect on `No module named 'project_setup'`, which reads like a
# broken checkout rather than a missing install step. `tools` is here because the port
# enforces the interview's invariants and the tests that pin them have to call it.
pythonpath = ["src", "tools"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "deptry",
    "nox",
]
