[project]
name = "project-setup"
version = "0.1.0"
description = "Deterministic, layered project scaffolding over Copier templates"
requires-python = ">=3.12"
dependencies = ["copier>=9.18", "pyyaml>=6"]

[project.scripts]
project-setup = "project_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_setup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
