# User-facing TypeScript web app: translated, accessibility-scanned, with CDK infra.
# A11Y_SURFACES_JSON and A11Y_WEB_SERVERS_JSON are composed answers -- replace the
# example routes. An empty surfaces array records axe scanning as a gap instead.
WANT_LANG_TS: true
WANT_I18N: true
WANT_A11Y: true
WANT_INFRA_AWS_CDK: true
WANT_RELEASE: true
WANT_WORKTRUNK: true
SPDX_ID: Apache-2.0
DEFAULT_BRANCH: main
FORGE_PLATFORM: github
JOB_TIMEOUT_MINUTES: "25"
MAX_FILE_KB: "512"
COMMIT_SCOPES: "web,i18n,a11y,infra,ci,deps"
HOOK_EXCLUDE_PATTERNS: ""
SETUP_COMMAND: just setup
DEV_COMMAND: bun run dev
NODE_VERSION: "24"
BUN_VERSION: "1.3.2"
BIOME_VERSION: "2.4.1"
RUN_NATIVE_INIT: false
BASE_LOCALE: en
LOCALES_JSON: '["en"]'
I18N_PROJECT_DIR: project.inlang
A11Y_SURFACES_JSON: '[{"name":"web","baseURL":"http://localhost:3000","routes":["/"]}]'
A11Y_WEB_SERVERS_JSON: '[{"command":"bun run dev","url":"http://localhost:3000","cwd":"."}]'
AWS_CDK_DEST_SHELL: infrastructure
INSTALL_COMMANDS: mise install && bun install
USAGE_EXAMPLE: just dev
# INLANG_MESSAGE_FORMAT_MODULE_URL has no safe default; supply the exact module URL.
