# TypeScript service fronted by a documented OpenAPI contract.
# The contract starter passes `vacuum lint --fail-severity warn` as generated, so the
# gate is green before the first endpoint is described.
WANT_LANG_TS: true
WANT_API: true
WANT_RELEASE: true
WANT_WORKTRUNK: true
SPDX_ID: Apache-2.0
DEFAULT_BRANCH: main
FORGE_PLATFORM: github
JOB_TIMEOUT_MINUTES: "20"
MAX_FILE_KB: "512"
COMMIT_SCOPES: "api,ci,deps"
HOOK_EXCLUDE_PATTERNS: ""
SETUP_COMMAND: just setup
NODE_VERSION: "24"
BUN_VERSION: "1.3.2"
BIOME_VERSION: "2.4.1"
RUN_NATIVE_INIT: false
API_VERSION: "1.0.0"
API_FAIL_SEVERITY: warn
INSTALL_COMMANDS: mise install && bun install
USAGE_EXAMPLE: just dev
# API_SERVER_URL and ORG have no safe default; supply them per project.
