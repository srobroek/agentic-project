# A TypeScript service behind a documented contract. The starter passes
# `vacuum lint --fail-severity warn` as generated, so the gate is green before the
# first endpoint exists. ORG and API_SERVER_URL are per-project.
_extends: [parts/policy, parts/forge-github, parts/lang-ts, parts/api, parts/delivery]
JOB_TIMEOUT_MINUTES: "20"
COMMIT_SCOPES: "api,ci,deps"
INSTALL_COMMANDS: mise install && bun install
USAGE_EXAMPLE: just dev
