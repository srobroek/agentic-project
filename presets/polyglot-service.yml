# A service with a Go backend and a TypeScript frontend in one repo.
WANT_LANG_GO: true
WANT_LANG_TS: true
SPDX_ID: Apache-2.0
DEFAULT_BRANCH: main
JOB_TIMEOUT_MINUTES: "20"
MAX_FILE_KB: "512"
COMMIT_SCOPES: "api,web,ci,deps"
HOOK_EXCLUDE_PATTERNS: ""
GO_VERSION: "1.26"
GOLANGCI_LINT_VERSION: "2.7.1"
GOVULNCHECK_VERSION: "1.1.4"
GO_VENDOR: false
NODE_VERSION: "24"
BUN_VERSION: "1.3.2"
BIOME_VERSION: "2.4.1"
INSTALL_COMMANDS: mise install && go mod download && bun install
USAGE_EXAMPLE: just dev
RUN_NATIVE_INIT: false
