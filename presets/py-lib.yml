# Python library: uv, ruff, pytest, src/ layout.
WANT_LANG_PYTHON: true
WANT_RELEASE: true
PY_SRC_LAYOUT: true
SPDX_ID: Apache-2.0
DEFAULT_BRANCH: main
FORGE_PLATFORM: github
JOB_TIMEOUT_MINUTES: "15"
MAX_FILE_KB: "512"
COMMIT_SCOPES: "lib,docs,ci,deps"
HOOK_EXCLUDE_PATTERNS: ""
PYTHON_VERSION: "3.13"
UV_VERSION: "0.9.8"
SETUP_COMMAND: just setup
INSTALL_COMMANDS: mise install && uv sync
USAGE_EXAMPLE: just test
