# TypeScript service: bun, biome/oxlint, Node 24.
WANT_LANG_TS: true
SPDX_ID: Apache-2.0
DEFAULT_BRANCH: main
JOB_TIMEOUT_MINUTES: "15"
MAX_FILE_KB: "512"
COMMIT_SCOPES: "api,web,ci,deps"
HOOK_EXCLUDE_PATTERNS: ""
NODE_VERSION: "24"
BUN_VERSION: "1.3.2"
BIOME_VERSION: "2.4.1"
INSTALL_COMMANDS: mise install && bun install
USAGE_EXAMPLE: just dev
# Let bun own package.json rather than templating it.
RUN_NATIVE_INIT: true
FORGE_PLATFORM: github
SETUP_COMMAND: just setup
WANT_RELEASE: true
WANT_WORKTRUNK: true
