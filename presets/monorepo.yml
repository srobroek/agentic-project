# Monorepo with Go and TypeScript members. MONOREPO_MEMBERS is a composed answer:
# each entry needs a job-safe name, a repo-relative path, and a capability map.
# Replace the example members before applying.
WANT_LANG_GO: true
WANT_LANG_TS: true
WANT_WORKTRUNK: true
WANT_RELEASE: true
IS_MONOREPO: true
MONOREPO_MEMBERS: |
  [
    {"name": "api", "path": "services/api", "capabilities": {"go": ["lint", "test"]}},
    {"name": "web", "path": "apps/web", "capabilities": {"ts": ["lint", "test"]}}
  ]
SPDX_ID: Apache-2.0
DEFAULT_BRANCH: main
FORGE_PLATFORM: github
JOB_TIMEOUT_MINUTES: "25"
MAX_FILE_KB: "512"
COMMIT_SCOPES: "api,web,ci,deps"
HOOK_EXCLUDE_PATTERNS: ""
GO_VERSION: "1.26"
GOLANGCI_LINT_VERSION: "2.7.1"
GOVULNCHECK_VERSION: "1.1.4"
GO_VENDOR: false
NODE_VERSION: "24"
BUN_VERSION: "1.3.2"
BIOME_VERSION: "2.4.1"
SETUP_COMMAND: just setup
INSTALL_COMMANDS: mise install && go mod download && bun install
USAGE_EXAMPLE: just dev
RUN_NATIVE_INIT: false
