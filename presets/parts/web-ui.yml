# A human-facing surface: translated and accessibility-scanned.
# INLANG_MESSAGE_FORMAT_MODULE_URL has no safe default; supply the exact module URL.
# Replace the example a11y routes -- an empty surfaces array records scanning as a gap.
WANT_I18N: true
WANT_A11Y: true
BASE_LOCALE: en
LOCALES_JSON: '["en"]'
I18N_PROJECT_DIR: project.inlang
# No example surface: a route nobody has written cannot be scanned, and a webServer
# command that does not exist failed `just check` on a fresh scaffold. Empty records
# axe scanning as a gap, which is the honest state of a repository on day one. Fill
# these in once a route serves something:
#   A11Y_SURFACES_JSON:    '[{"name":"web","baseURL":"http://localhost:3000","routes":["/"]}]'
#   A11Y_WEB_SERVERS_JSON: '[{"command":"bun run dev","url":"http://localhost:3000","cwd":"."}]'
A11Y_SURFACES_JSON: '[]'
A11Y_WEB_SERVERS_JSON: '[]'
