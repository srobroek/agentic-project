# .pre-commit-config.yaml -- maintained from .pre-commit.d/ by `just hooks-merge`.
#
# Configuration this file already carried is retained. A hook a fragment declares
# is owned by that fragment: rerunning after its answer changed replaces the entry
# and says so. Anything no fragment declares is left exactly as it is. Edit the
# fragment, never this file.
#
# `default_install_hook_types` has to name every stage the hooks below use, or
# `prek install` writes no shim for the missing one and that hook never fires.
default_install_hook_types:
- pre-commit
- commit-msg
- pre-push
repos:
- repo: builtin
  hooks:
  - id: trailing-whitespace
    groups:
    - hygiene
  - id: end-of-file-fixer
    groups:
    - hygiene
  - id: check-yaml
    groups:
    - hygiene
  - id: check-toml
    groups:
    - hygiene
  - id: check-merge-conflict
    groups:
    - hygiene
  - id: check-added-large-files
    args:
    - --maxkb=512
    groups:
    - hygiene
  - id: mixed-line-ending
    groups:
    - hygiene
  - id: detect-private-key
    groups:
    - security
- repo: https://github.com/betterleaks/betterleaks
  rev: v1.8.1
  hooks:
  - id: betterleaks-system
    groups:
    - security
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    groups:
    - quality
    args:
    - --strict
    - --scopes
    - lib,docs,ci,deps
- repo: https://github.com/crate-ci/typos
  rev: v1.50.2
  hooks:
  - id: typos
    groups:
    - docs
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    groups:
    - quality
- repo: local
  hooks:
  - id: normalize-close-keywords
    name: normalize GitHub close keywords
    entry: scripts/commit-msg-rewrite.py
    language: script
    stages:
    - commit-msg
    always_run: true
    groups:
    - quality
  - id: attribution-guard
    name: no AI attribution in the commit message
    entry: python3 scripts/attribution_guard.py
    language: system
    stages:
    - commit-msg
    always_run: true
    groups:
    - quality
  - id: no-force-push-to-default
    name: refuse a force push to main
    entry: scripts/no_force_push.sh
    args:
    - main
    language: script
    stages:
    - pre-push
    always_run: true
    pass_filenames: false
    groups:
    - security
  - id: trufflehog
    name: trufflehog (verified secrets)
    entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --no-update
    language: system
    pass_filenames: false
    groups:
    - security
  - id: actionlint
    name: actionlint
    entry: actionlint
    language: system
    files: ^\.github/workflows/.*\.ya?ml$
    groups:
    - quality
  - id: zizmor
    name: zizmor (workflow security)
    entry: zizmor --offline --persona regular
    language: system
    files: ^\.github/workflows/.*\.ya?ml$
    groups:
    - security
  - id: taplo
    name: taplo lint
    entry: taplo lint
    language: system
    types:
    - toml
    groups:
    - quality
  - id: lychee
    name: lychee (offline link check)
    entry: lychee --offline --no-progress
    language: system
    types:
    - markdown
    groups:
    - docs
  - id: ruff-format
    name: ruff format
    entry: uv run ruff format
    language: system
    types:
    - python
  - id: ruff-check
    name: ruff check
    entry: uv run ruff check --fix
    language: system
    types:
    - python
  - id: ty
    name: ty (type check)
    entry: uv run ty check
    language: system
    types:
    - python
    pass_filenames: false
    stages:
    - pre-push
