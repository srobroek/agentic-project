# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '

AWS_CDK_DEST:
  type: str
  help: Repo-relative CDK destination
  default: infrastructure
  validator: '{% if not (AWS_CDK_DEST | string | regex_search(''^[A-Za-z0-9._][A-Za-z0-9._/-]*$'')) %}AWS_CDK_DEST
    must be a repo-relative path, no spaces: deploy/cdk{% endif %}'
AWS_CDK_VERSION:
  type: str
  help: aws-cdk CLI, exact stable release
  default: 2.1143.0
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
AWS_CDK_DEST_SHELL:
  type: str
  help: Shell-quoted form of AWS_CDK_DEST; derived, do not set directly
  default: '@@ AWS_CDK_DEST | quote @@'
