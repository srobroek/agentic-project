# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
- '{% if IS_MEMBER %}

  /.github/

  /.gitlab/

  /.just.d/

  /.gitignore.d/

  /.pre-commit.d/

  /biome.json

  /.oxlintrc.json

  {% endif %}

  '

DEFAULT_BRANCH:
  type: str
  help: Branch CI listens on and the force-push guard protects
  default: main
  validator: '{% if not (DEFAULT_BRANCH | string | regex_search(''^[A-Za-z0-9._/-]+$'')) %}DEFAULT_BRANCH
    must have no spaces or shell characters: main, release/2.x{% endif %}'
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
IS_MEMBER:
  type: bool
  help: Scaffolding a monorepo member rather than a repository root
  default: false
