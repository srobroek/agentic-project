# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '

A11Y_PREPARE_COMMANDS:
  type: str
  help: Dependency and fixture setup before Playwright starts, indented four spaces
  default: ''
A11Y_SURFACES_JSON:
  type: str
  help: JSON array of {name, baseURL, routes}. '[]' records axe scanning as a gap
  default: '[]'
A11Y_WEB_SERVERS_JSON:
  type: str
  help: JSON array of Playwright {command, url, cwd} objects
  default: '[]'
AXE_PLAYWRIGHT_VERSION:
  type: str
  help: '@axe-core/playwright'
  default: 4.11.0
BUN_VERSION:
  type: str
  help: Bun
  default: 1.3.2
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
PLAYWRIGHT_VERSION:
  type: str
  help: Playwright
  default: 1.56.0
