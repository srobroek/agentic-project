# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '

A11Y_PREPARE_COMMANDS:
  default: ''
  help: Dependency and fixture setup before Playwright starts, indented four spaces
  type: str
A11Y_SURFACES_JSON:
  default: '[]'
  help: JSON array of {name, baseURL, routes}. '[]' records axe scanning as a gap
  type: str
A11Y_WEB_SERVERS_JSON:
  default: '[]'
  help: JSON array of Playwright {command, url, cwd} objects
  type: str
AXE_PLAYWRIGHT_VERSION:
  default: 4.11.0
  type: str
BUN_VERSION:
  default: 1.3.2
  type: str
FORGE_PLATFORM:
  choices:
  - github
  - gitlab
  default: github
  help: Only github and gitlab are supported; other forges are an explicit gap
  type: str
PLAYWRIGHT_VERSION:
  default: 1.56.0
  type: str
