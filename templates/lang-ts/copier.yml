# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/native_init.py'
  - ts
  - '@@ PROJECT_NAME @@'

BIOME_VERSION:
  default: 2.4.1
  type: str
BUN_VERSION:
  default: 1.3.2
  type: str
FORGE_PLATFORM:
  choices:
  - github
  - gitlab
  default: github
  help: Only github and gitlab are supported; other forges are an explicit gap
  type: str
JOB_TIMEOUT_MINUTES:
  default: '15'
  help: Per-job CI timeout; a hung job holds a runner until it fires
  type: str
NODE_VERSION:
  default: '24'
  type: str
PROJECT_NAME:
  help: Repository name, lowercase with dashes
  type: str
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z][a-z0-9-]+$'')) %}PROJECT_NAME must
    match ^[a-z][a-z0-9-]+${% endif %}'
