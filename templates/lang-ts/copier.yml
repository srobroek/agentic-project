# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/native_init.py'
  - ts
  - '@@ PROJECT_NAME @@'
  - '@biomejs/biome=@@ BIOME_VERSION @@,oxlint=@@ OXLINT_VERSION @@,oxlint-tsgolint=@@ TSGOLINT_VERSION
    @@,knip=@@ KNIP_VERSION @@'

BIOME_VERSION:
  type: str
  help: Biome
  default: 2.4.1
BUN_VERSION:
  type: str
  help: Bun
  default: 1.3.2
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
JOB_TIMEOUT_MINUTES:
  type: str
  help: Per-job CI timeout; a hung job holds a runner until it fires
  default: '15'
KNIP_VERSION:
  type: str
  help: knip
  default: 6.38.0
NODE_VERSION:
  type: str
  help: Node major, for tools that need a Node runtime
  default: '24'
OXLINT_VERSION:
  type: str
  help: oxlint
  default: 1.85.0
PROJECT_NAME:
  type: str
  help: Repository name, lowercase with dashes
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$'')) %}PROJECT_NAME
    must be lowercase letters, digits and dashes, starting with a letter and ending with a letter or digit
    -- my-app, flint, api2. It becomes the crate, package and module name{% endif %}'
TSGOLINT_VERSION:
  type: str
  help: oxlint-tsgolint, which oxlint's type-aware rules require
  default: 7.0.2002
