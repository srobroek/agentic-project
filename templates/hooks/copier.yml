# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'

COMMIT_SCOPES:
  default: ''
  help: Allowed commit scopes, comma separated. Empty leaves scopes unrestricted
  type: str
DEFAULT_BRANCH:
  default: main
  type: str
  validator: '{% if not (DEFAULT_BRANCH | string | regex_search(''^[a-z0-9._/-]+$'')) %}DEFAULT_BRANCH
    must match ^[a-z0-9._/-]+${% endif %}'
HOOK_EXCLUDE_PATTERNS:
  default: ''
  help: Paths excluded from hooks, joined with \|. Empty drops the block
  type: str
MAX_FILE_KB:
  default: '512'
  type: str
UV_VERSION:
  default: 0.9.8
  type: str
