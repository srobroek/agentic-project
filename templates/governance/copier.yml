# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/materialise_license.py'
  - '@@ SPDX_ID @@'
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/write_adrs.py'
  - '@@ _copier_conf.src_path @@/tasks/ADR.md.template'
  - '@@ ADRS @@'
  when: '@@ ADRS not in ('''', ''[]'', None) @@'

ADRS:
  default: '[]'
  help: JSON array of ADRs, each {title, decision, rationale, alternatives, consequences, confirmation}.
    Composed, not chosen. One file is written per entry
  type: str
CODEOWNER:
  help: Owner or team for CODEOWNERS, e.g. @me or @org/team
  type: str
CODE_OF_CONDUCT_CONTACT:
  default: ''
  help: Reporting contact. Empty omits CODE_OF_CONDUCT.md
  type: str
SECURITY_CONTACT:
  help: Private security channel, or the forge advisory URL
  type: str
SPDX_ID:
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  default: Apache-2.0
  help: Licence. Materialised into LICENSE by a post-copy task
  type: str
