# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
- '{% if IS_MEMBER %}

  /.github/

  /.gitlab/

  /.just.d/

  /.gitignore.d/

  /.pre-commit.d/

  /biome.json

  /.oxlintrc.json

  {% endif %}

  '

API_FAIL_SEVERITY:
  type: str
  help: vacuum lint severity that fails the gate
  choices:
  - error
  - warn
  - info
  default: warn
API_SERVER_URL:
  type: str
  help: Production endpoint. Unknown at setup time is normal
  placeholder: https://api.example.com
  default: https://api.example.com
API_VERSION:
  type: str
  help: Version of your contract, not of OpenAPI
  default: 0.1.0
DEFAULT_BRANCH:
  type: str
  help: Branch CI listens on and the force-push guard protects
  default: main
  validator: '{% if not (DEFAULT_BRANCH | string | regex_search(''^[A-Za-z0-9._/-]+$'')) %}DEFAULT_BRANCH
    must have no spaces or shell characters: main, release/2.x{% endif %}'
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
IS_MEMBER:
  type: bool
  help: Scaffolding a monorepo member rather than a repository root
  default: false
JOB_TIMEOUT_MINUTES:
  type: str
  help: Per-job CI timeout; a hung job holds a runner until it fires
  default: '15'
OASDIFF_VERSION:
  type: str
  help: oasdiff
  default: 1.32.1
ORG:
  type: str
  help: Organisation or owner, used for the API contact
  placeholder: TODO-org
  default: TODO-org
REPO_URL:
  type: str
  help: Remote URL. Empty drops the blocks that reference it
  default: ''
SPDX_ID:
  type: str
  help: Licence, or NONE for an unpublished repository. Writes LICENSE
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  - NONE
  default: Apache-2.0
VACUUM_VERSION:
  type: str
  help: vacuum
  default: 0.30.6
API_BASELINE_REF:
  type: str
  help: Git ref the contract diff compares against
  default: origin/@@ DEFAULT_BRANCH @@
API_DESCRIPTION:
  type: str
  default: '@@ DESCRIPTION @@'
API_TITLE:
  type: str
  default: '@@ PROJECT_NAME @@'
