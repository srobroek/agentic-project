# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '

API_BASELINE_REF:
  default: origin/@@ DEFAULT_BRANCH @@
  help: Git ref the contract diff compares against
  type: str
API_DESCRIPTION:
  default: '@@ DESCRIPTION @@'
  type: str
API_FAIL_SEVERITY:
  choices:
  - error
  - warn
  - info
  default: warn
  help: vacuum lint severity that fails the gate
  type: str
API_SERVER_URL:
  default: https://api.example.com
  help: Production endpoint. Unknown at setup time is normal
  placeholder: https://api.example.com
  type: str
API_TITLE:
  default: '@@ PROJECT_NAME @@'
  type: str
API_VERSION:
  default: 0.1.0
  help: Version of your contract, not of OpenAPI
  type: str
DEFAULT_BRANCH:
  default: main
  help: Branch CI listens on and the force-push guard protects
  type: str
  validator: '{% if not (DEFAULT_BRANCH | string | regex_search(''^[a-z0-9._/-]+$'')) %}DEFAULT_BRANCH
    must match ^[a-z0-9._/-]+${% endif %}'
FORGE_PLATFORM:
  choices:
  - github
  - gitlab
  default: github
  help: Only github and gitlab are supported; other forges are an explicit gap
  type: str
JOB_TIMEOUT_MINUTES:
  default: '15'
  help: Per-job CI timeout; a hung job holds a runner until it fires
  type: str
ORG:
  default: TODO-org
  help: Organisation or owner, used for the API contact
  placeholder: TODO-org
  type: str
REPO_URL:
  default: ''
  help: Remote URL. Empty drops the blocks that reference it
  type: str
SPDX_ID:
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  default: Apache-2.0
  help: Licence. Materialised into LICENSE by a post-copy task
  type: str
