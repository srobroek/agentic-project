# GENERATED by tools/port_assets.py -- the single question set.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_answers_file: .project-setup-answers.yml
_exclude:
- copier.yml
_message_after_copy: 'Answers recorded in .project-setup-answers.yml.

  Run `project-setup apply --data-file .project-setup-answers.yml` to scaffold.'

WANT_RELEASE:
  type: bool
  default: false
  help: Include the release layer?
WANT_WORKTRUNK:
  type: bool
  default: false
  help: Include the worktrunk layer?
WANT_LANG_GO:
  type: bool
  default: false
  help: Include the lang-go layer?
WANT_LANG_PYTHON:
  type: bool
  default: false
  help: Include the lang-python layer?
WANT_LANG_TS:
  type: bool
  default: false
  help: Include the lang-ts layer?
WANT_LANG_RUST:
  type: bool
  default: false
  help: Include the lang-rust layer?
BIOME_VERSION:
  type: str
  default: 2.4.1
  when: '@@ WANT_LANG_TS @@'
BUN_VERSION:
  type: str
  default: 1.3.2
  when: '@@ WANT_LANG_TS @@'
CARGO_DENY_VERSION:
  type: str
  default: 0.19.1
  when: '@@ WANT_LANG_RUST @@'
CARGO_LLVM_COV_VERSION:
  type: str
  default: 0.6.20
  when: '@@ WANT_LANG_RUST @@'
CARGO_MACHETE_VERSION:
  type: str
  default: 0.9.1
  when: '@@ WANT_LANG_RUST @@'
CARGO_NEXTEST_VERSION:
  type: str
  default: 0.9.104
  when: '@@ WANT_LANG_RUST @@'
CODEOWNER:
  type: str
  help: Owner or team for CODEOWNERS, e.g. @me or @org/team
CODE_OF_CONDUCT_CONTACT:
  type: str
  help: Reporting contact. Empty omits CODE_OF_CONDUCT.md
  default: ''
COMMIT_SCOPES:
  type: str
  help: Allowed commit scopes, comma separated. Empty leaves scopes unrestricted
  default: ''
DEFAULT_BRANCH:
  type: str
  default: main
  validator: '{% if not (DEFAULT_BRANCH | string | regex_search(''^[a-z0-9._/-]+$'')) %}DEFAULT_BRANCH
    must match ^[a-z0-9._/-]+${% endif %}'
DESCRIPTION:
  type: str
  help: One-line purpose
DEV_COMMAND:
  type: str
  help: Dev server command. Empty drops the worktree dev-server block
  default: ''
  when: '@@ WANT_WORKTRUNK @@'
FORGE_HOSTNAME:
  type: str
  help: Self-hosted forge host. Empty means the platform's public host
  default: ''
  when: '@@ WANT_WORKTRUNK @@'
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
GOLANGCI_LINT_VERSION:
  type: str
  default: 2.7.1
  when: '@@ WANT_LANG_GO @@'
GOVULNCHECK_VERSION:
  type: str
  default: 1.1.4
  when: '@@ WANT_LANG_GO @@'
GO_VENDOR:
  type: bool
  help: Commit vendor/?
  default: false
  when: '@@ WANT_LANG_GO @@'
GO_VERSION:
  type: str
  default: '1.26'
  when: '@@ WANT_LANG_GO @@'
HOOK_EXCLUDE_PATTERNS:
  type: str
  help: Paths excluded from hooks, joined with \|. Empty drops the block
  default: ''
INSTALL_COMMANDS:
  type: str
  default: mise install && just setup
IS_MONOREPO:
  type: bool
  help: Monorepo? Writes .ci/members.json, which drives per-member CI jobs
  default: false
JOB_TIMEOUT_MINUTES:
  type: str
  default: '15'
MAX_FILE_KB:
  type: str
  default: '512'
MONOREPO_MEMBERS:
  type: str
  help: JSON array of monorepo members, each {name, path, capabilities}. Composed, not chosen. '[]' is
    the single-root case
  default: '[]'
NODE_VERSION:
  type: str
  default: '24'
  when: '@@ WANT_LANG_TS @@'
PROJECT_NAME:
  type: str
  help: Repository name, lowercase with dashes
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z][a-z0-9-]+$'')) %}PROJECT_NAME must
    match ^[a-z][a-z0-9-]+${% endif %}'
PYTHON_VERSION:
  type: str
  default: '3.13'
  when: '@@ WANT_LANG_PYTHON @@'
PYTHON_VERSION_NODOT:
  type: str
  help: Derived from PYTHON_VERSION; override only if you must
  default: '@@ PYTHON_VERSION | replace(''.'', '''') @@'
  when: '@@ WANT_LANG_PYTHON @@'
PY_SRC_LAYOUT:
  type: bool
  help: src/ layout? (false for a flat layout)
  default: true
  when: '@@ WANT_LANG_PYTHON @@'
RUN_NATIVE_INIT:
  type: bool
  default: false
  help: Run the native toolchain init (cargo/bun) as a post-copy task?
  when: '@@ WANT_LANG_RUST or WANT_LANG_TS @@'
RUST_LIBRARY:
  type: bool
  help: Library crate? (a binary crate commits Cargo.lock)
  default: true
  when: '@@ WANT_LANG_RUST @@'
RUST_VERSION:
  type: str
  default: 1.93.0
  when: '@@ WANT_LANG_RUST @@'
SECURITY_CONTACT:
  type: str
  help: Private security channel, or the forge advisory URL
SETUP_COMMAND:
  type: str
  default: just setup
  when: '@@ WANT_WORKTRUNK @@'
SPDX_ID:
  type: str
  help: Licence. Materialised into LICENSE by a post-copy task
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  default: Apache-2.0
USAGE_EXAMPLE:
  type: str
  default: just dev
UV_VERSION:
  type: str
  default: 0.9.8
