# GENERATED by tools/port_assets.py -- the single question set.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_answers_file: .project-setup-answers.yml
_exclude:
- copier.yml
_message_after_copy: Answers recorded in .project-setup-answers.yml.

PROJECT_NAME:
  type: str
  help: Repository name. Becomes the crate, package and module name
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$'')) %}PROJECT_NAME
    must be lowercase letters, digits and dashes: my-app, api2{% endif %}'
DESCRIPTION:
  type: str
  help: One-line purpose
LAYERS:
  type: str
  multiselect: true
  choices:
    'release -- release-please: versioning, changelog, tags': release
    worktrunk -- parallel-agent worktrees and their setup hooks: worktrunk
    'lang-go -- Go: golangci-lint, govulncheck, per-package tests': lang-go
    'lang-python -- Python: uv, ruff, ty, pytest, nox': lang-python
    'lang-ts -- TypeScript: bun, biome, oxlint, knip': lang-ts
    'lang-rust -- Rust: clippy, nextest, deny, machete, llvm-cov': lang-rust
    api -- an OpenAPI contract, linted and diffed in CI: api
    i18n -- Inlang and Paraglide message catalogues: i18n
    a11y -- Playwright and axe scans of named routes: a11y
    infra-aws-cdk -- AWS CDK in TypeScript, in its own subtree: infra-aws-cdk
  default: []
  help: Layers to include, beyond the seven every project gets
WANT_RELEASE:
  type: bool
  default: '@@ ''release'' in LAYERS @@'
  when: 'false'
WANT_WORKTRUNK:
  type: bool
  default: '@@ ''worktrunk'' in LAYERS @@'
  when: 'false'
WANT_LANG_GO:
  type: bool
  default: '@@ ''lang-go'' in LAYERS @@'
  when: 'false'
WANT_LANG_PYTHON:
  type: bool
  default: '@@ ''lang-python'' in LAYERS @@'
  when: 'false'
WANT_LANG_TS:
  type: bool
  default: '@@ ''lang-ts'' in LAYERS @@'
  when: 'false'
WANT_LANG_RUST:
  type: bool
  default: '@@ ''lang-rust'' in LAYERS @@'
  when: 'false'
WANT_API:
  type: bool
  default: '@@ ''api'' in LAYERS @@'
  when: 'false'
WANT_I18N:
  type: bool
  default: '@@ ''i18n'' in LAYERS @@'
  when: 'false'
WANT_A11Y:
  type: bool
  default: '@@ ''a11y'' in LAYERS @@'
  when: 'false'
WANT_INFRA_AWS_CDK:
  type: bool
  default: '@@ ''infra-aws-cdk'' in LAYERS @@'
  when: 'false'
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
PIN_TOOL_VERSIONS:
  type: bool
  default: false
  choices:
    Keep the pinned versions Renovate bumps: false
    Choose the tool versions myself: true
  help: Tool versions
CUSTOMISE_DEFAULTS:
  type: bool
  default: false
  choices:
    Keep the shipped hook, CI and README defaults: false
    Change some of them: true
  help: Hook, CI and README defaults
INSTALL_COMMANDS:
  type: str
  help: What a fresh clone runs to install dependencies; shown in the README
  default: mise install && just setup
  when: '@@ CUSTOMISE_DEFAULTS @@'
USAGE_EXAMPLE:
  type: str
  help: One command the README shows for running the project
  default: just dev
  when: '@@ CUSTOMISE_DEFAULTS @@'
IS_MEMBER:
  type: bool
  help: Scaffolding a monorepo member rather than a repository root
  default: false
  when: 'false'
SPDX_ID:
  type: str
  help: Licence, or NONE for an unpublished repository. Writes LICENSE
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  - NONE
  default: Apache-2.0
CODEOWNER:
  type: str
  help: Owner or team for CODEOWNERS, e.g. @me or @org/team
  placeholder: '@TODO-owner'
  default: '@TODO-owner'
SECURITY_CONTACT:
  type: str
  help: Private security channel, or the forge advisory URL
  placeholder: security@example.com
  default: security@example.com
CODE_OF_CONDUCT_CONTACT:
  type: str
  help: Reporting contact. Empty omits CODE_OF_CONDUCT.md
  default: ''
  when: '@@ CUSTOMISE_DEFAULTS @@'
ADRS:
  type: str
  help: JSON array of ADRs, one file written each; [] writes none
  default: '[]'
  when: 'false'
DEFAULT_BRANCH:
  type: str
  help: Branch CI listens on and the force-push guard protects
  default: main
  validator: '{% if not (DEFAULT_BRANCH | string | regex_search(''^[A-Za-z0-9._/-]+$'')) %}DEFAULT_BRANCH
    must have no spaces or shell characters: main, release/2.x{% endif %}'
MAX_FILE_KB:
  type: str
  help: Largest file the added-large-files hook accepts
  default: '512'
  when: '@@ CUSTOMISE_DEFAULTS @@'
HOOK_EXCLUDE_PATTERNS:
  type: str
  help: Paths excluded from hooks, joined with \|. Empty drops the block
  default: ''
  when: '@@ CUSTOMISE_DEFAULTS @@'
COMMIT_SCOPES:
  type: str
  help: Allowed commit scopes, comma separated. Empty leaves scopes unrestricted
  default: ''
  when: '@@ CUSTOMISE_DEFAULTS @@'
PREK_VERSION:
  type: str
  help: prek hook runner
  default: 0.4.11
  when: '@@ PIN_TOOL_VERSIONS @@'
BETTERLEAKS_VERSION:
  type: str
  help: betterleaks
  default: 1.8.1
  when: '@@ PIN_TOOL_VERSIONS @@'
TRUFFLEHOG_VERSION:
  type: str
  help: trufflehog
  default: 3.97.9
  when: '@@ PIN_TOOL_VERSIONS @@'
TYPOS_VERSION:
  type: str
  help: typos
  default: 1.50.2
  when: '@@ PIN_TOOL_VERSIONS @@'
SHELLCHECK_VERSION:
  type: str
  help: shellcheck
  default: 0.11.0
  when: '@@ PIN_TOOL_VERSIONS @@'
ACTIONLINT_VERSION:
  type: str
  help: actionlint
  default: 1.7.12
  when: '@@ PIN_TOOL_VERSIONS @@'
ZIZMOR_VERSION:
  type: str
  help: zizmor
  default: 1.28.0
  when: '@@ PIN_TOOL_VERSIONS @@'
TAPLO_VERSION:
  type: str
  help: taplo
  default: 0.10.0
  when: '@@ PIN_TOOL_VERSIONS @@'
LYCHEE_VERSION:
  type: str
  help: lychee
  default: 0.24.2
  when: '@@ PIN_TOOL_VERSIONS @@'
CONVENTIONAL_PRECOMMIT_VERSION:
  type: str
  help: conventional-pre-commit
  default: 4.4.0
  when: '@@ PIN_TOOL_VERSIONS @@'
UV_VERSION:
  type: str
  help: uv
  default: 0.12.18
  when: '@@ PIN_TOOL_VERSIONS @@'
JUST_VERSION:
  type: str
  help: just
  default: 1.58.0
  when: '@@ PIN_TOOL_VERSIONS @@'
JOB_TIMEOUT_MINUTES:
  type: str
  help: Per-job CI timeout; a hung job holds a runner until it fires
  default: '15'
  when: '@@ CUSTOMISE_DEFAULTS @@'
PINACT_VERSION:
  type: str
  help: pinact
  default: 5.0.0
  when: '@@ PIN_TOOL_VERSIONS @@'
OPENGREP_VERSION:
  type: str
  help: opengrep
  default: 1.26.0
  when: '@@ PIN_TOOL_VERSIONS @@'
MONOREPO_MEMBERS:
  type: str
  help: JSON array of {name, path, capabilities}; [] is single-root
  default: '[]'
  when: 'false'
IS_MONOREPO:
  type: bool
  help: 'Per-member CI: true when MONOREPO_MEMBERS lists anybody'
  default: '@@ MONOREPO_MEMBERS not in ('''', ''[]'', None) @@'
  when: 'false'
BUN_VERSION:
  type: str
  help: Bun
  default: 1.4.2
  when: '@@ (WANT_A11Y or WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
A11Y_SURFACES_JSON:
  type: str
  help: JSON array of {name, baseURL, routes}. '[]' records axe scanning as a gap
  default: '[]'
  when: '@@ (WANT_A11Y) @@'
A11Y_WEB_SERVERS_JSON:
  type: str
  help: JSON array of Playwright {command, url, cwd} objects
  default: '[]'
  when: '@@ (WANT_A11Y) @@'
A11Y_PREPARE_COMMANDS:
  type: str
  help: Dependency and fixture setup before Playwright starts, indented four spaces
  default: ''
  when: '@@ (WANT_A11Y) @@'
PLAYWRIGHT_VERSION:
  type: str
  help: Playwright
  default: 1.63.0
  when: '@@ (WANT_A11Y) and PIN_TOOL_VERSIONS @@'
AXE_PLAYWRIGHT_VERSION:
  type: str
  help: '@axe-core/playwright'
  default: 4.13.0
  when: '@@ (WANT_A11Y) and PIN_TOOL_VERSIONS @@'
VACUUM_VERSION:
  type: str
  help: vacuum
  default: 0.30.6
  when: '@@ (WANT_API) and PIN_TOOL_VERSIONS @@'
OASDIFF_VERSION:
  type: str
  help: oasdiff
  default: 1.32.1
  when: '@@ (WANT_API) and PIN_TOOL_VERSIONS @@'
ORG:
  type: str
  help: Organisation or owner, used for the API contact
  placeholder: TODO-org
  default: TODO-org
  when: '@@ (WANT_API) @@'
REPO_URL:
  type: str
  help: Remote URL. Empty drops the blocks that reference it
  default: ''
  when: '@@ (WANT_API) @@'
API_TITLE:
  type: str
  default: '@@ PROJECT_NAME @@'
  when: 'false'
API_VERSION:
  type: str
  help: Version of your contract, not of OpenAPI
  default: 0.1.0
  when: '@@ (WANT_API) @@'
API_DESCRIPTION:
  type: str
  default: '@@ DESCRIPTION @@'
  when: 'false'
API_SERVER_URL:
  type: str
  help: Production endpoint. Unknown at setup time is normal
  placeholder: https://api.example.com
  default: https://api.example.com
  when: '@@ (WANT_API) @@'
API_FAIL_SEVERITY:
  type: str
  help: vacuum lint severity that fails the gate
  choices:
  - error
  - warn
  - info
  default: warn
  when: '@@ (WANT_API) @@'
API_BASELINE_REF:
  type: str
  help: Git ref the contract diff compares against
  default: origin/@@ DEFAULT_BRANCH @@
  when: 'false'
NODE_VERSION:
  type: str
  help: Node major, for tools that need a Node runtime
  default: '24'
  when: '@@ (WANT_I18N or WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
BASE_LOCALE:
  type: str
  help: Locale the source messages are authored in
  default: en
  when: '@@ (WANT_I18N) @@'
LOCALES_JSON:
  type: str
  help: JSON array of shipped locales, including the base locale
  default: '["en"]'
  when: '@@ (WANT_I18N) @@'
INLANG_MESSAGE_FORMAT_MODULE_URL:
  type: str
  help: Inlang message-format plugin module URL; pin the version you want
  placeholder: https://cdn.jsdelivr.net/npm/@inlang/plugin-message-format@4/dist/index.js
  default: https://cdn.jsdelivr.net/npm/@inlang/plugin-message-format@4/dist/index.js
  when: '@@ (WANT_I18N) @@'
I18N_PROJECT_DIR:
  type: str
  help: Inlang project dir, repo-relative, e.g. apps/web/project.inlang
  default: project.inlang
  validator: '{% if not (I18N_PROJECT_DIR | string | regex_search(''^[A-Za-z0-9._/-]+$'')) %}I18N_PROJECT_DIR
    must be a repo-relative path: apps/web/project.inlang{% endif %}'
  when: '@@ (WANT_I18N) @@'
I18N_MESSAGES_DIR:
  type: str
  help: Derived from I18N_PROJECT_DIR; do not set directly
  default: '@@ (I18N_PROJECT_DIR.rpartition(''/'')[0] ~ ''/messages'').lstrip(''/'') @@'
  when: 'false'
I18N_PREPARE_COMMANDS:
  type: str
  help: Extra catalog preparation commands, indented four spaces
  default: ''
  when: '@@ (WANT_I18N) and CUSTOMISE_DEFAULTS @@'
I18N_CHECK_COMMANDS:
  type: str
  help: Extra completeness commands, e.g. one per deployable, indented four spaces
  default: ''
  when: '@@ (WANT_I18N) and CUSTOMISE_DEFAULTS @@'
AWS_CDK_DEST:
  type: str
  help: Repo-relative CDK destination
  default: infrastructure
  validator: '{% if not (AWS_CDK_DEST | string | regex_search(''^[A-Za-z0-9._][A-Za-z0-9._/-]*$'')) %}AWS_CDK_DEST
    must be a repo-relative path, no spaces: deploy/cdk{% endif %}'
  when: '@@ (WANT_INFRA_AWS_CDK or WANT_LANG_TS) @@'
AWS_CDK_DEST_SHELL:
  type: str
  help: Shell-quoted form of AWS_CDK_DEST; derived, do not set directly
  default: '@@ AWS_CDK_DEST | quote @@'
  when: 'false'
AWS_CDK_VERSION:
  type: str
  help: aws-cdk CLI, exact stable release
  default: 2.1143.0
  when: '@@ (WANT_INFRA_AWS_CDK) and PIN_TOOL_VERSIONS @@'
GO_VENDOR:
  type: bool
  help: Vendored dependencies
  choices:
    Do not commit vendor/: false
    Commit vendor/: true
  default: false
  when: '@@ (WANT_LANG_GO) @@'
GO_VERSION:
  type: str
  help: Go toolchain
  default: '1.27'
  when: '@@ (WANT_LANG_GO) and PIN_TOOL_VERSIONS @@'
GOLANGCI_LINT_VERSION:
  type: str
  help: golangci-lint
  default: 2.14.0
  when: '@@ (WANT_LANG_GO) and PIN_TOOL_VERSIONS @@'
GOVULNCHECK_VERSION:
  type: str
  help: govulncheck
  default: 1.1.4
  when: '@@ (WANT_LANG_GO) and PIN_TOOL_VERSIONS @@'
PY_SRC_LAYOUT:
  type: bool
  help: Package layout
  choices:
    src/ layout: true
    Flat layout: false
  default: true
  when: '@@ (WANT_LANG_PYTHON) @@'
PYTHON_VERSION:
  type: str
  help: Python minor, e.g. 3.13. Sets requires-python and the ruff target
  default: '3.14'
  when: '@@ (WANT_LANG_PYTHON) and PIN_TOOL_VERSIONS @@'
PYTHON_VERSION_NODOT:
  type: str
  help: Derived from PYTHON_VERSION; override only if you must
  default: '@@ PYTHON_VERSION | replace(''.'', '''') @@'
  when: 'false'
RUST_LIBRARY:
  type: bool
  help: Crate kind
  choices:
    Library crate: true
    Binary crate, which commits Cargo.lock: false
  default: true
  when: '@@ (WANT_LANG_RUST) @@'
RUST_VERSION:
  type: str
  help: Rust toolchain, written to rust-toolchain.toml
  default: 1.98.1
  when: '@@ (WANT_LANG_RUST) and PIN_TOOL_VERSIONS @@'
CARGO_NEXTEST_VERSION:
  type: str
  help: cargo-nextest
  default: 0.9.146
  when: '@@ (WANT_LANG_RUST) and PIN_TOOL_VERSIONS @@'
CARGO_DENY_VERSION:
  type: str
  help: cargo-deny
  default: 0.20.2
  when: '@@ (WANT_LANG_RUST) and PIN_TOOL_VERSIONS @@'
CARGO_MACHETE_VERSION:
  type: str
  help: cargo-machete
  default: 0.9.2
  when: '@@ (WANT_LANG_RUST) and PIN_TOOL_VERSIONS @@'
CARGO_LLVM_COV_VERSION:
  type: str
  help: cargo-llvm-cov
  default: 0.9.1
  when: '@@ (WANT_LANG_RUST) and PIN_TOOL_VERSIONS @@'
BIOME_VERSION:
  type: str
  help: Biome
  default: 2.5.14
  when: '@@ (WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
OXLINT_VERSION:
  type: str
  help: oxlint
  default: 1.85.0
  when: '@@ (WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
TSGOLINT_VERSION:
  type: str
  help: oxlint-tsgolint, which oxlint's type-aware rules require
  default: 7.0.2003
  when: '@@ (WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
KNIP_VERSION:
  type: str
  help: knip
  default: 6.38.0
  when: '@@ (WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
TYPES_BUN_VERSION:
  type: str
  help: '@types/bun'
  default: 1.4.2
  when: '@@ (WANT_LANG_TS) and PIN_TOOL_VERSIONS @@'
FORGE_HOSTNAME:
  type: str
  help: Self-hosted forge host. Empty means the platform's public host
  default: ''
  when: '@@ (WANT_WORKTRUNK) @@'
SETUP_COMMAND:
  type: str
  help: What a freshly created worktree runs to become usable
  default: just setup
  when: '@@ (WANT_WORKTRUNK) @@'
DEV_COMMAND:
  type: str
  help: Dev server command. Empty drops the worktree dev-server block
  default: ''
  when: '@@ (WANT_WORKTRUNK) @@'
