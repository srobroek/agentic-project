# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
- '{% if not IS_MONOREPO %}

  /.ci/members.json

  {% endif %}

  '

FORGE_PLATFORM:
  choices:
  - github
  - gitlab
  default: github
  help: Only github and gitlab are supported; other forges are an explicit gap
  type: str
IS_MONOREPO:
  default: false
  help: Monorepo? Writes .ci/members.json, which drives per-member CI jobs
  type: bool
JOB_TIMEOUT_MINUTES:
  default: '15'
  help: Per-job CI timeout; a hung job holds a runner until it fires
  type: str
MONOREPO_MEMBERS:
  default: '[]'
  help: JSON array of {name, path, capabilities}; [] is single-root
  type: str
