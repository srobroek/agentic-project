# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
- '{% if not IS_MONOREPO %}

  /.ci/members.json

  {% endif %}

  '

FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
JOB_TIMEOUT_MINUTES:
  type: str
  help: Per-job CI timeout; a hung job holds a runner until it fires
  default: '15'
MONOREPO_MEMBERS:
  type: str
  help: JSON array of {name, path, capabilities}; [] is single-root
  default: '[]'
IS_MONOREPO:
  type: bool
  help: 'Per-member CI: true when MONOREPO_MEMBERS lists anybody'
  default: '@@ MONOREPO_MEMBERS not in ('''', ''[]'', None) @@'
