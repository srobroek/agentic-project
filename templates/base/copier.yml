# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/git_init.py'
  when: '@@ _copier_operation == ''copy'' @@'

DESCRIPTION:
  type: str
  help: One-line purpose
INSTALL_COMMANDS:
  type: str
  help: What a fresh clone runs to install dependencies; shown in the README
  default: mise install && just setup
PROJECT_NAME:
  type: str
  help: Repository name. Becomes the crate, package and module name
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$'')) %}PROJECT_NAME
    must be lowercase letters, digits and dashes: my-app, api2{% endif %}'
USAGE_EXAMPLE:
  type: str
  help: One command the README shows for running the project
  default: just dev
