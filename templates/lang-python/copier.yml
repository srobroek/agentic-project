# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '

FORGE_PLATFORM:
  choices:
  - github
  - gitlab
  default: github
  help: Only github and gitlab are supported; other forges are an explicit gap
  type: str
JOB_TIMEOUT_MINUTES:
  default: '15'
  type: str
PYTHON_VERSION:
  default: '3.13'
  type: str
PYTHON_VERSION_NODOT:
  default: '@@ PYTHON_VERSION | replace(''.'', '''') @@'
  help: Derived from PYTHON_VERSION; override only if you must
  type: str
PY_SRC_LAYOUT:
  default: true
  help: src/ layout? (false for a flat layout)
  type: bool
UV_VERSION:
  default: 0.9.8
  type: str
