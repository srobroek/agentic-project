# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
- '{% if IS_MEMBER %}

  /.github/

  /.gitlab/

  /.just.d/

  /.gitignore.d/

  /.pre-commit.d/

  /biome.json

  /.oxlintrc.json

  {% endif %}

  '
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/native_init.py'
  - py
  - '@@ PROJECT_NAME @@:@@ ''src'' if PY_SRC_LAYOUT else ''flat'' @@:@@ PYTHON_VERSION @@'

FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
IS_MEMBER:
  type: bool
  help: Scaffolding a monorepo member rather than a repository root
  default: false
JOB_TIMEOUT_MINUTES:
  type: str
  help: Per-job CI timeout; a hung job holds a runner until it fires
  default: '15'
PROJECT_NAME:
  type: str
  help: Repository name. Becomes the crate, package and module name
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$'')) %}PROJECT_NAME
    must be lowercase letters, digits and dashes: my-app, api2{% endif %}'
PYTHON_VERSION:
  type: str
  help: Python minor, e.g. 3.13. Sets requires-python and the ruff target
  default: '3.14'
PY_SRC_LAYOUT:
  type: bool
  help: Package layout
  choices:
    src/ layout: true
    Flat layout: false
  default: true
UV_VERSION:
  type: str
  help: uv
  default: 0.12.18
PYTHON_VERSION_NODOT:
  type: str
  help: Derived from PYTHON_VERSION; override only if you must
  default: '@@ PYTHON_VERSION | replace(''.'', '''') @@'
