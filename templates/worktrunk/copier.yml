# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store

DEV_COMMAND:
  type: str
  help: Dev server command. Empty drops the worktree dev-server block
  default: ''
FORGE_HOSTNAME:
  type: str
  help: Self-hosted forge host. Empty means the platform's public host
  default: ''
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
SETUP_COMMAND:
  type: str
  help: What a freshly created worktree runs to become usable
  default: just setup
