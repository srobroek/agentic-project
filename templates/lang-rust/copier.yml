# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- __pycache__
- '*.pyc'
- .pytest_cache
- .ruff_cache
- .DS_Store
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/native_init.py'
  - rust
  - '@@ PROJECT_NAME @@:@@ ''lib'' if RUST_LIBRARY else ''bin'' @@'
  - '@@ SPDX_ID @@'

CARGO_DENY_VERSION:
  type: str
  help: cargo-deny
  default: 0.20.2
CARGO_LLVM_COV_VERSION:
  type: str
  help: cargo-llvm-cov
  default: 0.9.1
CARGO_MACHETE_VERSION:
  type: str
  help: cargo-machete
  default: 0.9.2
CARGO_NEXTEST_VERSION:
  type: str
  help: cargo-nextest
  default: 0.9.146
FORGE_PLATFORM:
  type: str
  help: Only github and gitlab are supported; other forges are an explicit gap
  choices:
  - github
  - gitlab
  default: github
JOB_TIMEOUT_MINUTES:
  type: str
  help: Per-job CI timeout; a hung job holds a runner until it fires
  default: '15'
PROJECT_NAME:
  type: str
  help: Repository name. Becomes the crate, package and module name
  validator: '{% if not (PROJECT_NAME | string | regex_search(''^[a-z](?:[a-z0-9-]*[a-z0-9])?$'')) %}PROJECT_NAME
    must be lowercase letters, digits and dashes: my-app, api2{% endif %}'
RUST_LIBRARY:
  type: bool
  help: Crate kind
  choices:
    Library crate: true
    Binary crate, which commits Cargo.lock: false
  default: true
RUST_VERSION:
  type: str
  help: Rust toolchain, written to rust-toolchain.toml
  default: 1.98.1
SPDX_ID:
  type: str
  help: Licence, or NONE for an unpublished repository. Writes LICENSE
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  - NONE
  default: Apache-2.0
