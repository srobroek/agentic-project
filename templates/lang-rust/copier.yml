# GENERATED by tools/port_assets.py -- do not hand-edit.
_envops:
  variable_start_string: '@@'
  variable_end_string: '@@'
  keep_trailing_newline: true
_exclude:
- copier.yml
- tasks
- '*.rej'
- '*.orig'
- '{% if FORGE_PLATFORM != ''github'' %}

  /.github/

  {% endif %}

  {% if FORGE_PLATFORM != ''gitlab'' %}

  /.gitlab/

  /.gitlab-ci.yml

  {% endif %}

  '
_tasks:
- command:
  - '@@ _copier_python @@'
  - '@@ _copier_conf.src_path @@/tasks/native_init.py'
  - rust
  - '@@ ''lib'' if RUST_LIBRARY else ''bin'' @@'
  when: '@@ RUN_NATIVE_INIT @@'

CARGO_DENY_VERSION:
  default: 0.19.1
  type: str
CARGO_LLVM_COV_VERSION:
  default: 0.6.20
  type: str
CARGO_MACHETE_VERSION:
  default: 0.9.1
  type: str
CARGO_NEXTEST_VERSION:
  default: 0.9.104
  type: str
FORGE_PLATFORM:
  choices:
  - github
  - gitlab
  default: github
  help: Only github and gitlab are supported; other forges are an explicit gap
  type: str
JOB_TIMEOUT_MINUTES:
  default: '15'
  type: str
RUN_NATIVE_INIT:
  default: false
  help: Run the native toolchain init (cargo/bun) as a post-copy task?
  type: bool
RUST_LIBRARY:
  default: true
  help: Library crate? (a binary crate commits Cargo.lock)
  type: bool
RUST_VERSION:
  default: 1.93.0
  type: str
SPDX_ID:
  choices:
  - Apache-2.0
  - MIT
  - MPL-2.0
  - AGPL-3.0-only
  default: Apache-2.0
  help: Licence. Materialised into LICENSE by a post-copy task
  type: str
